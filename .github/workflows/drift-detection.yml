name: Project Atlas - Drift Detection

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1-5"

permissions:
  contents: read
  id-token: write

concurrency:
  group: project-atlas-drift-atlas-dev
  cancel-in-progress: false

jobs:
  drift:
    name: Inspect infrastructure
    runs-on: ubuntu-latest
    environment: atlas-dev
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure read-only AWS access
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DRIFT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ProjectAtlasDriftCheck

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Check deployed Lambda version
        id: lambda_version
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          VERSION=$(aws lambda get-function-configuration \
            --function-name project-atlas \
            --region "$AWS_REGION" \
            --query 'Environment.Variables.APP_VERSION' \
            --output text)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deployed APP_VERSION: $VERSION"

      - name: Initialize Terraform
        run: terraform -chdir=infrastructure init -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infrastructure validate

      - name: Diagnose Terraform configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "## Terraform diagnostics" >> "$GITHUB_STEP_SUMMARY"

          echo "Terraform configuration files:"
          find infrastructure -maxdepth 1 -type f -name '*.tf' -print | sort

          echo ""
          echo "Checking application version and lifecycle settings:"
          grep -R -n -E 'app_version|ignore_changes|environment[[:space:]]*\{' \
            infrastructure --include='*.tf' || true

          echo ""
          echo "Terraform state resource addresses:"
          terraform -chdir=infrastructure state list

          echo ""
          echo "Terraform provider requirements:"
          terraform -chdir=infrastructure providers

      - name: Create read-only Terraform plan
        id: plan
        shell: bash
        run: |
          set -uo pipefail

          PLAN_FILE="$RUNNER_TEMP/project-atlas-plan.txt"

          set +e
          terraform -chdir=infrastructure plan \
            -input=false \
            -lock-timeout=5m \
            -detailed-exitcode \
            -no-color \
            > "$PLAN_FILE" 2>&1
          result=$?
          set -e

          cat "$PLAN_FILE"
          cat "$PLAN_FILE" >> "$GITHUB_STEP_SUMMARY"

          case "$result" in
            0)
              echo "result=clean" >> "$GITHUB_OUTPUT"
              echo "## Drift detection: No changes" >> "$GITHUB_STEP_SUMMARY"
              echo "No proposed infrastructure changes were detected."
              ;;
            2)
              echo "result=changes" >> "$GITHUB_OUTPUT"
              echo "## Drift detection: Changes detected" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Terraform proposed changes. Review the plan to distinguish infrastructure drift from configuration changes."
              ;;
            *)
              echo "## Drift detection: Failed" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Terraform plan failed. Check the logs, state access, and AWS permissions."
              exit "$result"
              ;;
          esac

      - name: Report drift check outcome
        if: always() && steps.plan.outcome == 'success'
        env:
          PLAN_RESULT: ${{ steps.plan.outputs.result }}
          LAMBDA_VERSION: ${{ steps.lambda_version.outputs.version }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        shell: bash
        run: |
          {
            echo "## Project Atlas drift report"
            echo ""
            echo "- **AWS region:** $AWS_REGION"
            echo "- **Lambda function:** project-atlas"
            echo "- **Deployed APP_VERSION:** $LAMBDA_VERSION"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PLAN_RESULT" = "clean" ]; then
            echo "- **Result:** No proposed changes" >> "$GITHUB_STEP_SUMMARY"
            echo "Drift check completed: no proposed changes."
          elif [ "$PLAN_RESULT" = "changes" ]; then
            echo "- **Result:** Changes detected; review the Terraform plan" >> "$GITHUB_STEP_SUMMARY"
            echo "Drift check completed: proposed changes require review."
          fi
