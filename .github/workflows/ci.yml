name: Project Atlas - CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        working-directory: app
        run: python -m unittest discover -v

  terraform-check:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: Initialize Terraform without a backend
        run: terraform -chdir=infrastructure init -backend=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infrastructure validate
