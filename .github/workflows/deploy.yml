name: Project Atlas - Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: project-atlas-atlas-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Plan and deploy
    runs-on: ubuntu-latest
    environment: atlas-dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ProjectAtlasDeploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        run: terraform -chdir=infrastructure init

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: Validate Terraform configuration
        run: terraform -chdir=infrastructure validate

      - name: Create Terraform plan
        run: terraform -chdir=infrastructure plan -out=tfplan

      - name: Apply Terraform plan
        run: terraform -chdir=infrastructure apply -auto-approve tfplan
